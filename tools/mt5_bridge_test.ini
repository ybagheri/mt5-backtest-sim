; Launch configuration for the live bridge check.
;
; The terminal opens one chart with the bridge expert attached. The expert
; connects to the named pipe the simulator creates, answers the ping and
; answers the ATR request.
[Common]
AllowLiveTrading=0
AllowDllImport=1
Reconnect=0
Expert=1

[Experts]
Expert=ForexSimulatorBridge
Symbol=EURUSD
Period=M1
ExpertParameters=mt5_backtest_sim.ini

[Charts]
Symbol=EURUSD
Period=M1
Template=default
